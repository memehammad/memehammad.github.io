<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clash Timers – Clash of Clans widget for Android</title>
<meta name="description" content="Clash Timers: the free, open-source Clash of Clans widget for Android. Free builders, upgrade timers and notifications on your home screen.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta property="og:site_name" content="Clash Timers">
<script type="application/ld+json">
{"@context": "https://schema.org", "@type": "WebSite", "name": "Clash Timers", "alternateName": ["Clash Timers for Android", "memehammad"], "url": "https://memehammad.github.io/"}
</script>
<style>
  :root { --bg:#F5FAFD; --fg:#171C1F; --muted:#40484C; --card:#BAEAFF; --on-card:#004D62; --primary:#0C6780; --on-primary:#FFFFFF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0F1417; --fg:#DEE3E6; --muted:#C0C8CC; --card:#004D62; --on-card:#BAEAFF; --primary:#89D0ED; --on-primary:#003545; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--fg); font:17px/1.5 system-ui, sans-serif; }
  main { margin:16px; max-width:460px; background:var(--card); color:var(--on-card); border-radius:32px; padding:32px 28px; text-align:center; }
  img { width:96px; height:96px; border-radius:24px; }
  h1 { font-size:30px; line-height:1.15; margin:16px 0 8px; }
  p { margin:0 0 20px; }
  a.btn { display:inline-flex; align-items:center; min-height:52px; padding:0 28px; border-radius:999px; background:var(--primary); color:var(--on-primary); font-weight:650; text-decoration:none; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="Clash Timers icon" width="96" height="96">
  <h1>Clash Timers</h1>
  <p>The free, open-source Clash of Clans widget for Android.</p>
  <a class="btn" href="/clash-timers/">Open Clash Timers</a>
</main>
</body>
</html>
